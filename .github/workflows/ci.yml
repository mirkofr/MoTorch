name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Check formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Test
        run: python -m pytest
      - name: Build distributions
        run: python -m build
      - name: Install and import from wheel
        shell: bash
        run: |
          python -m venv wheel-test
          wheel-test/bin/python -m pip install --upgrade pip
          wheel-test/bin/python -m pip install dist/*.whl
          wheel-test/bin/python -c "import motorch; assert motorch.__version__ == '0.0.1'"
