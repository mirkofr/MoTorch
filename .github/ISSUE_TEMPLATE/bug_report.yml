name: Bug report
description: Report reproducible incorrect behavior in MoTorch.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting a problem. Do not include secrets or active security vulnerabilities.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the current and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest runnable example and complete traceback.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MoTorch version or commit
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment details
      description: Include operating system and relevant dependency versions.
  - type: textarea
    id: numerical
    attributes:
      label: Numerical considerations
      description: Include shapes, dtypes, devices, seeds, tolerances, and gradients when relevant.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: This report contains no private information, credentials, or active vulnerability details.
          required: true
