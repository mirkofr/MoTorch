[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motorch"
version = "0.0.1"
description = "A low-level, modular, tensor-native optimization research library."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["optimization", "bayesian-optimization", "scientific-computing", "pytorch"]
dependencies = ["torch>=2.10,<3"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/mirkofr/MoTorch"
Repository = "https://github.com/mirkofr/MoTorch"
Issues = "https://github.com/mirkofr/MoTorch/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pre-commit>=3.8,<5",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
motorch = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
pretty = true
show_error_codes = true
warn_unreachable = true
